<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIME Book Orders</title>
<meta name="theme-color" content="#1F4E33">
<link rel="icon" href="staff/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="staff/icons/apple-touch-icon.png">
<style>
  /* Student page — iOS structure, CAS palette */
  :root { --accent:#0f7f4c; --accent-soft:#e6f4ed; --accent-ink:#0b5a36; --bg:#f2f4f3; --panel:#fff; --ink:#1f2a33; --muted:#6b7a86; --faint:#98a4ad;
          --line:rgba(31,42,51,.10); --line-soft:rgba(31,42,51,.06); --red:#c62828; --amber:#9a6700; --amber-bg:#fff4d6; --blue:#2f6fe0; --blue-bg:#e8f0fa; --grey-bg:#eef1f0;
          --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06); --r:14px; --r-sm:10px;
          --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1412; --panel:#171d1a; --ink:#eef2f0; --muted:#9aa8a1; --faint:#6f7d76; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06);
          --accent-soft:#163a2a; --accent-ink:#9fdcbd; --accent:#2bb673; --amber-bg:#3a2c0a; --amber:#f2c572; --blue-bg:#14233f; --blue:#9cc0ff; --grey-bg:#262d2a; --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35); } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--ink); font-size:17px; line-height:1.4; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px)); }
  header { display:flex; align-items:center; justify-content:space-between; padding:6px 0 14px; }
  header h1 { font-size:17px; margin:0; font-weight:700; letter-spacing:.12em; color:var(--accent-ink); text-transform:uppercase; }
  header button { font-size:14px; padding:7px 12px; font-weight:600; background:var(--accent-soft); color:var(--accent-ink); border:none; border-radius:999px; }
  .card { background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r); padding:18px 16px; margin-bottom:14px; box-shadow:var(--shadow); animation:fade .18s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  h2 { font-size:26px; letter-spacing:-.02em; margin:0 0 6px; font-weight:700; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 4px 8px; font-weight:600; }
  p { margin:6px 0; }
  .muted { color:var(--muted); font-size:15px; }
  label { display:block; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 4px 8px; }
  input[type=text], input[type=tel], input[type=email], input[type=number], input[type=password], textarea, select {
    width:100%; font-size:17px; font-family:inherit; padding:13px 14px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg); color:var(--ink); }
  input::placeholder, textarea::placeholder { color:var(--faint); }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(15,127,76,.18); background:var(--panel); }
  textarea { min-height:72px; resize:vertical; }
  .check { display:flex; align-items:flex-start; gap:14px; padding:14px; border:1px solid var(--line); border-radius:12px; margin-top:8px; cursor:pointer; text-transform:none; letter-spacing:0; font-size:17px; font-weight:500; color:var(--ink); transition:border-color .15s, background .15s; }
  .check:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  .check input { width:24px; height:24px; margin:0; flex:none; accent-color:var(--accent); }
  .check small { display:block; font-size:13px; font-weight:400; margin-top:2px; }
  .check .price { margin-left:auto; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  button { font-size:17px; padding:13px 16px; border-radius:12px; border:none; background:var(--accent-soft); color:var(--accent-ink); cursor:pointer; font-family:inherit; font-weight:600; }
  button:active { opacity:.7; }
  button.primary { background:var(--accent); color:#fff; width:100%; margin-top:18px; box-shadow:0 6px 18px rgba(15,127,76,.25); padding:15px; }
  button.small { font-size:15px; padding:11px 14px; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .row button { flex:1; }
  .total { display:flex; justify-content:space-between; font-size:20px; font-weight:700; margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft); font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .b-new { background:var(--grey-bg); color:var(--muted); }
  .b-sent { background:var(--amber-bg); color:var(--amber); }
  .b-ready { background:var(--accent-soft); color:var(--accent-ink); }
  .b-picked { background:var(--blue-bg); color:var(--blue); }
  .b-cancel { background:var(--grey-bg); color:var(--faint); }
  .code { font-family:var(--mono); font-size:40px; letter-spacing:8px; font-weight:700; text-align:center; padding:22px 16px 22px 24px; background:var(--accent-soft); color:var(--accent-ink); border-radius:14px; margin:12px 0; }
  .copybox { font-family:var(--mono); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; word-break:break-all; display:flex; justify-content:space-between; align-items:center; gap:8px; margin:8px 0; }
  .copybox button { flex:none; padding:8px 12px; font-size:14px; }
  .steps { padding-left:20px; margin:8px 0; }
  .steps li { margin:8px 0; }
  .error { color:var(--red); font-size:14px; margin:12px 4px 0; font-weight:500; }
  .success { color:var(--accent-ink); font-size:15px; margin-top:10px; font-weight:500; }
  .hidden { display:none !important; }
  .order { border-top:1px solid var(--line-soft); padding:14px 0; }
  .order:first-child { border-top:none; padding-top:0; }
  .order .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .order .name { font-weight:700; font-size:17px; }
  .link { color:var(--accent); background:none; border:none; padding:0; font-size:15px; font-weight:500; }
  .center { text-align:center; }
  .spinner { text-align:center; padding:32px; color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { .card { animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="brand">PRIME</h1>
  </header>

  <div id="loading" class="spinner">Loading…</div>

  <!-- ================= STUDENT: order form (3 steps) ================= -->
  <section id="v-order" class="hidden">
    <div class="card" id="step-who">
      <h2>Order your books</h2>
      <p class="muted">Tell us who you are. We'll find you in our records, then you pick your books.</p>
      <label for="f-name">Full name</label>
      <input id="f-name" type="text" autocomplete="name" placeholder="First and last name">
      <label for="f-email">Email</label>
      <input id="f-email" type="email" autocomplete="email" inputmode="email" placeholder="The email you gave the college">
      <label for="f-phone">Phone</label>
      <input id="f-phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="The number you gave the college">
      <div id="f-error" class="error hidden"></div>
      <button class="primary" id="f-find" onclick="findMe()">Continue</button>
    </div>

    <div class="card hidden" id="step-confirm">
      <h2>Is this you?</h2>
      <div id="f-matches"></div>
      <div class="row"><button class="small" onclick="backToWho()">No, go back</button></div>
    </div>

    <div class="card hidden" id="step-books">
      <div class="muted" id="f-whoami"></div>
      <h3>Books</h3>
      <label class="check"><input type="checkbox" id="f-sorrentino" onchange="recalc()"><span>Sorrentino textbook<br><small class="muted" id="s-sorrentino"></small></span><span class="price" id="p-sorrentino"></span></label>
      <label class="check"><input type="checkbox" id="f-palliative" onchange="recalc()"><span>Palliative textbook + workbook (bundle)<br><small class="muted" id="s-palliative"></small></span><span class="price" id="p-palliative"></span></label>
      <label for="f-note">Note (optional)</label>
      <textarea id="f-note" placeholder="Anything we should know"></textarea>
      <div class="total"><span>To pay</span><span id="f-total">$0</span></div>
      <div id="f-error2" class="error hidden"></div>
      <button class="primary" id="f-submit" onclick="submitOrder()">Place order</button>
      <div class="row"><button class="small" onclick="backToWho()">Change my details</button></div>
    </div>
    <p class="center"><button class="link" onclick="go('find')">Already ordered? Find my order</button></p>
  </section>

  <!-- ================= STUDENT: find my order ================= -->
  <section id="v-find" class="hidden">
    <div class="card">
      <h2>Find my order</h2>
      <label for="s-contact">Email or phone you ordered with</label>
      <input id="s-contact" type="text" autocomplete="email">
      <label for="s-name">Full name</label>
      <input id="s-name" type="text" placeholder="As you typed it when ordering">
      <div id="s-error" class="error hidden"></div>
      <button class="primary" onclick="findMine()">Find</button>
      <div id="s-results"></div>
    </div>
    <p class="center"><button class="link" onclick="go('order')">Place a new order</button></p>
  </section>

  <!-- ================= STUDENT: order status ================= -->
  <section id="v-status" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2 style="margin:0">Order #<span id="o-no"></span></h2>
        <span id="o-badge" class="badge"></span>
      </div>
      <p class="muted" id="o-summary"></p>
      <div id="o-body"></div>
      <p class="muted" style="margin-top:14px">Save this page. Bookmark it or copy the link; it updates by itself.</p>
      <div class="row"><button class="small" onclick="refreshStatus()">Refresh</button><button class="small" onclick="copyText(orderLink(), this)">Copy my link</button></div>
      <div id="o-error" class="error hidden"></div>
    </div>
    <p class="center"><button class="link" onclick="go('order')">Place another order</button></p>
  </section>

  <p class="center" style="margin-top:28px"><a href="staff/" style="font-size:13px;color:var(--faint);text-decoration:none">Staff</a></p>
</div>

<script src="config.js"></script>
<script>
  /* Runs outside Google Apps Script: same page, but google.script.run becomes a fetch() to the API. */
  (function () {
    var API = (window.PRIME_CONFIG && window.PRIME_CONFIG.api) || '';
    function make(ok, fail) {
      var api = { withSuccessHandler: function (f) { return make(f, fail); }, withFailureHandler: function (f) { return make(ok, f); } };
      return new Proxy(api, { get: function (t, name) { if (name in t) return t[name]; return function () {
        var args = Array.prototype.slice.call(arguments);
        if (!API) { fail && fail(new Error('This page is not connected to the order system yet.')); return; }
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: name, args: args }), redirect: 'follow' })
          .then(function (r) { if (!r.ok) throw new Error('Server error (' + r.status + ')'); return r.json(); })
          .then(function (j) { if (j && j.ok) ok && ok(j.result); else fail && fail(new Error((j && j.error) || 'Unexpected reply')); })
          .catch(function (e) { fail && fail(e); });
      }; } });
    }
    var params = {}; new URLSearchParams(location.search).forEach(function (v, k) { params[k] = v; });
    window.google = { script: { run: make(null, null), history: { replaceState: function (s, p) { var q = Object.keys(p || {}).map(function (k) { return k + '=' + encodeURIComponent(p[k]); }).join('&'); history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } } } };
    window.__INITIAL__ = params; window.__BASE_URL__ = location.origin + location.pathname;
  })();
</script>
<script>
  var INITIAL = window.__INITIAL__;
  var BASE_URL = window.__BASE_URL__;
  var state = { cfg:null, token:null, order:null, poll:null, matches:[], match:null };

  /* ---------- plumbing ---------- */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
      runner[fn].apply(runner, args);
    });
  }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function money(n) { return '$' + Number(n || 0).toLocaleString('en-CA'); }
  function when(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return String(iso); return d.toLocaleString('en-CA', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
  function showErr(id, msg) { var el = $(id); el.textContent = msg; el.classList.toggle('hidden', !msg); }
  function items(o) { var a = []; if (o.sorrentino) a.push('Sorrentino'); if (o.palliative) a.push('Palliative bundle'); return a.join(' + '); }
  function badge(o) {
    var cls = { NEW:'b-new', SENT:'b-sent', READY:'b-ready', PICKED_UP:'b-picked', CANCELLED:'b-cancel' }[o.status] || 'b-cancel';
    var txt = { NEW:'Waiting for payment', SENT:'Payment sent', READY:'Ready for pickup', PICKED_UP:'Picked up', CANCELLED:'Cancelled' }[o.status] || o.status;
    return '<span class="badge ' + cls + '">' + esc(txt) + '</span>';
  }
  function copyText(text, btn) {
    var done = function () { if (btn) { var t = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = t; }, 1500); } };
    var fallback = function () {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'absolute'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select(); var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) done(); else if (btn) { btn.textContent = text; }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  function stopPoll() { if (state.poll) { clearInterval(state.poll); state.poll = null; } }
  function orderLink() { return (BASE_URL || location.href.split('?')[0].split('#')[0]) + '?o=' + encodeURIComponent(state.token || ''); }
  function setUrlParams(params) {
    try {
      if (window.google && google.script && google.script.history) google.script.history.replaceState(null, params, '');
      else { var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&'); history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); }
    } catch (e) {}
  }

  var VIEWS = ['order', 'find', 'status'];
  function go(view) {
    stopPoll();
    VIEWS.forEach(function (v) { $('v-' + v).classList.toggle('hidden', v !== view); });
    $('loading').classList.add('hidden');
    if (view === 'status') startPoll();
    else setUrlParams({});
    window.scrollTo(0, 0);
  }

  /* ---------- student: order form ---------- */
  function showStep(id) { ['step-who', 'step-confirm', 'step-books'].forEach(function (x) { $(x).classList.toggle('hidden', x !== id); }); window.scrollTo(0, 0); }
  function backToWho() { state.match = null; showStep('step-who'); }
  function findMe() {
    showErr('f-error', '');
    var name = $('f-name').value.trim(), email = $('f-email').value.trim(), phone = $('f-phone').value.trim();
    if (!name) return showErr('f-error', 'Enter your full name.');
    if (!email && !phone) return showErr('f-error', 'Enter your email or your phone number.');
    var btn = $('f-find'); btn.disabled = true; btn.textContent = 'Looking you up…';
    call('findStudent', email, phone).then(function (r) {
      btn.disabled = false; btn.textContent = 'Continue';
      if (!r.found) return showErr('f-error', 'We couldn\'t find that email or phone number in our records. Check for typos, or ask reception to update your contact details.');
      state.matches = r.matches;
      if (r.matches.length === 1) return chooseMatch(0);
      $('f-matches').innerHTML = r.matches.map(function (m, i) {
        return '<div class="order"><div class="name">' + esc(m.name) + '</div><div class="muted">' + esc(m.batch) + '</div><div class="row"><button class="small" onclick="chooseMatch(' + i + ')">That\'s me</button></div></div>';
      }).join('');
      showStep('step-confirm');
    }).catch(function (e) { btn.disabled = false; btn.textContent = 'Continue'; showErr('f-error', e.message || String(e)); });
  }
  function chooseMatch(i) {
    var m = state.matches[i]; state.match = m;
    $('f-whoami').innerHTML = 'Ordering as <strong>' + esc(m.name) + '</strong> · ' + esc(m.batch) + ' <button class="link" onclick="backToWho()">not you?</button>';
    setBookLine('sorrentino', m.books.sorrentino);
    setBookLine('palliative', m.books.palliative);
    $('f-sorrentino').checked = false; $('f-palliative').checked = false;
    recalc(); showStep('step-books');
  }
  function setBookLine(key, b) {
    var st = $('s-' + key), pr = $('p-' + key);
    if (b.status === 'included') { st.textContent = 'Included in your fees'; pr.textContent = 'Included'; }
    else if (b.status === 'paid') { st.textContent = 'Our records show this was already paid' + (b.paidOn ? ' on ' + b.paidOn : '') + '. Order only if you still need the book.'; pr.textContent = money(b.price); }
    else { st.textContent = ''; pr.textContent = money(b.price); }
  }
  function recalc() {
    var m = state.match; if (!m) return;
    var t = ($('f-sorrentino').checked ? m.books.sorrentino.price : 0) + ($('f-palliative').checked ? m.books.palliative.price : 0);
    $('f-total').textContent = money(t);
  }
  function submitOrder() {
    showErr('f-error2', '');
    var form = { name:$('f-name').value, email:$('f-email').value, phone:$('f-phone').value, note:$('f-note').value,
                 sorrentino:$('f-sorrentino').checked, palliative:$('f-palliative').checked, matchKey: state.match ? state.match.key : '' };
    if (!form.sorrentino && !form.palliative) return showErr('f-error2', 'Choose at least one book.');
    var btn = $('f-submit'); btn.disabled = true; btn.textContent = 'Placing order…';
    call('createOrder', form).then(function (o) {
      btn.disabled = false; btn.textContent = 'Place order';
      showOrder(o);
    }).catch(function (e) { btn.disabled = false; btn.textContent = 'Place order'; showErr('f-error2', e.message || String(e)); });
  }

  /* ---------- student: status page ---------- */
  function showOrder(o) {
    state.order = o; state.token = o.token;
    setUrlParams({ o: o.token });
    // The status page needs the e-transfer email from config; wait for it (already loaded in the background).
    cfgReady.then(function () { renderOrder(); go('status'); });
  }
  function renderOrder() {
    var o = state.order, cfg = state.cfg;
    $('o-no').textContent = o.orderNo;
    $('o-badge').outerHTML = badge(o).replace('class="badge', 'id="o-badge" class="badge');
    $('o-summary').textContent = o.name + ' · ' + o.batch + ' · ' + items(o) + ' · ' + (o.included ? 'included in fees' : money(o.amount));
    var h = '';
    if ((o.status === 'NEW' || o.status === 'SENT') && o.included) {
      h += '<h3>Your books are included in your fees</h3><p>Nothing to pay. The office will confirm your order and your pickup code will appear here, usually the same day.</p>';
    } else if (o.status === 'NEW' || o.status === 'SENT') {
      h += '<h3>Send your e-transfer</h3><ol class="steps">' +
        '<li>Send <strong>' + money(o.amount) + '</strong> by Interac e-transfer to:' +
        '<div class="copybox"><span>' + esc(cfg.etransferEmail) + '</span><button class="small" onclick="copyText(\'' + esc(cfg.etransferEmail) + '\', this)">Copy</button></div></li>' +
        '<li>In the transfer message, write your order number:' +
        '<div class="copybox"><span>Order ' + o.orderNo + '</span><button class="small" onclick="copyText(\'Order ' + o.orderNo + '\', this)">Copy</button></div></li>' +
        '<li>Come back here and tap the button below.</li></ol>';
      if (o.status === 'NEW') h += '<button class="primary" onclick="markSent()">I\'ve sent the e-transfer</button>';
      else h += '<p class="success">Thanks. Sent ' + esc(when(o.sentAt)) + '. Your pickup code will appear here once the payment is confirmed (usually the same day).</p>';
    } else if (o.status === 'READY') {
      h += '<h3>Your pickup code</h3><div class="code">' + esc(o.pickupCode) + '</div><p>' + esc(cfg.pickupNote) + '</p>';
    } else if (o.status === 'PICKED_UP') {
      h += '<p class="success">Picked up ' + esc(when(o.pickedUpAt)) + '. Enjoy your books.</p>';
    } else if (o.status === 'CANCELLED') {
      h += '<p>This order was cancelled. If that\'s a mistake, talk to reception.</p>';
    }
    $('o-body').innerHTML = h;
  }
  function markSent() {
    showErr('o-error', '');
    call('markSent', state.token).then(function (o) { state.order = o; renderOrder(); }).catch(function (e) { showErr('o-error', e.message || String(e)); });
  }
  function refreshStatus() {
    if (!state.token) return;
    call('getOrder', state.token).then(function (o) { if (o) { state.order = o; renderOrder(); showErr('o-error', ''); } })
      .catch(function (e) { showErr('o-error', 'Could not refresh: ' + (e.message || e)); });
  }
  function startPoll() { stopPoll(); state.poll = setInterval(refreshStatus, 20000); }

  /* ---------- student: find my order ---------- */
  function findMine() {
    showErr('s-error', ''); $('s-results').innerHTML = '';
    call('findOrders', $('s-contact').value, $('s-name').value).then(function (list) {
      $('s-results').innerHTML = '<h3>Your orders</h3>' + list.map(function (o) {
        return '<div class="order"><div class="top"><span class="name">#' + o.orderNo + ' · ' + esc(items(o)) + '</span>' + badge(o) + '</div>' +
          '<div class="muted">' + esc(when(o.createdAt)) + ' · ' + money(o.amount) + '</div>' +
          '<div class="row"><button class="small" onclick="openFound(\'' + esc(o.token) + '\')">Open</button></div></div>';
      }).join('');
    }).catch(function (e) { showErr('s-error', e.message || String(e)); });
  }
  function openFound(token) { call('getOrder', token).then(function (o) { if (o) showOrder(o); }); }

  /* ---------- boot ---------- */
  function applyConfig(cfg) {
    state.cfg = cfg;
    $('brand').textContent = cfg.schoolName || 'PRIME';
    document.title = (cfg.schoolName ? cfg.schoolName + ' ' : '') + 'Book orders';
  }
  // Config (e-transfer email, pickup note) loads in the background so the form appears instantly,
  // even while the server is cold-starting. Retries once; falls back to safe defaults.
  state.cfg = { schoolName: 'PRIME', etransferEmail: '', pickupNote: 'Show this code at reception to pick up your books.' };
  var cfgReady = call('getPublicConfig').catch(function () { return call('getPublicConfig'); })
    .then(function (cfg) { if (cfg) applyConfig(cfg); return state.cfg; })
    .catch(function () { return state.cfg; });
  function boot() {
    var token = String(INITIAL.o || '').trim();
    if (token) {
      state.token = token;
      call('getOrder', token).then(function (o) { if (o) showOrder(o); else go('order'); }).catch(function () { go('order'); });
    } else go('order');
  }
  boot();
</script>
</body>
</html>
