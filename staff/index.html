<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRIME (Staff)">
<title>PRIME (Staff)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="bar-title"><span class="mark" aria-hidden="true"></span><span id="bar-name">PRIME</span></div>
    <div class="bar-right"><span id="bar-role" class="role"></span><button id="bar-menu" class="icon-btn" aria-label="Menu" hidden>&#8942;</button></div>
  </header>

  <main id="main">
    <section id="v-boot" class="screen center"><div class="spinner" aria-label="Loading"></div></section>

    <section id="v-setup" class="screen" hidden>
      <div class="hero"><div class="hero-mark" aria-hidden="true"></div><h1>Connect to the order system</h1><p class="muted">One-time setup. Paste the web app link from Google Apps Script (it ends in <code>/exec</code>).</p></div>
      <label for="setup-url">Order system link</label>
      <input id="setup-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <p id="setup-error" class="error" hidden></p>
      <button id="setup-go" class="primary">Connect</button>
    </section>

    <section id="v-login" class="screen" hidden>
      <div class="hero"><div class="hero-mark" aria-hidden="true"></div><h1>Staff sign in</h1><p class="muted">Enter your PIN to see book orders.</p></div>
      <label for="login-pin">PIN</label>
      <input id="login-pin" type="password" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="go">
      <label class="check-row"><input id="login-remember" type="checkbox" checked> Stay signed in on this phone</label>
      <p id="login-error" class="error" hidden></p>
      <button id="login-go" class="primary">Sign in</button>
      <p class="fineprint"><button id="setup-change" class="link">Change order system link</button></p>
    </section>

    <section id="v-queue" class="screen" hidden>
      <nav id="tabs" class="tabs" aria-label="Order lists"></nav>
      <p id="queue-error" class="error" hidden></p>
      <div id="offline" class="banner" hidden>You're offline. Showing the last list; actions will work again when you're back online.</div>
      <div id="list" class="list"></div>
      <p id="updated" class="fineprint center"></p>
    </section>

    <section id="v-settings" class="screen" hidden>
      <h1>Settings</h1>
      <label for="set-school_name">School name</label><input id="set-school_name" type="text">
      <label for="set-etransfer_email">E-transfer email (students send money here)</label><input id="set-etransfer_email" type="email">
      <div class="two">
        <div><label for="set-price_sorrentino">Sorrentino price</label><input id="set-price_sorrentino" type="number" min="0" step="1" inputmode="numeric"></div>
        <div><label for="set-price_palliative">Palliative bundle price</label><input id="set-price_palliative" type="number" min="0" step="1" inputmode="numeric"></div>
      </div>
      <label for="set-pickup_note">Pickup note shown to students</label><textarea id="set-pickup_note" rows="3"></textarea>
      <div class="two">
        <div><label for="set-admin_pin">Admin PIN</label><input id="set-admin_pin" type="text" autocomplete="off"></div>
        <div><label for="set-reception_pin">Reception PIN</label><input id="set-reception_pin" type="text" autocomplete="off"></div>
      </div>
      <p id="set-error" class="error" hidden></p>
      <p id="set-ok" class="success" hidden></p>
      <button id="set-save" class="primary">Save settings</button>
      <button id="set-back" class="secondary">Back to orders</button>
    </section>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <button id="sheet-refresh" class="sheet-item">Refresh now</button>
      <button id="sheet-settings" class="sheet-item" hidden>Settings</button>
      <button id="sheet-lookup" class="sheet-item">Re-read accounting workbook</button>
      <button id="sheet-install" class="sheet-item" hidden>Add to home screen</button>
      <button id="sheet-signout" class="sheet-item danger">Sign out</button>
      <button id="sheet-close" class="sheet-item muted">Close</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="../config.js"></script>
<script src="app.js"></script>
</body>
</html>
